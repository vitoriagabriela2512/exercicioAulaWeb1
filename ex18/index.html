<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ExercicioAulaWeb018</title>
</head>
<body>
    <button id="contador">Clique aqui</button>

    <script>
      let cont = 0;
      document.getElementById("contador").onclick = () => {
        cont++;
        alert("Cliques: " + cont);
      };
    </script>
</body>
