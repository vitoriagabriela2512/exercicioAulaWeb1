<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ExercicioAulaWeb08</title>
</head>
<body>
    <h1>Veja o console</h1>
    <script>
      var texto = "Olá";
      var numero = 42;
      var booleano = true;
      var lista = [1, 2, 3];
      var objeto = {nome: "Ana"};
      var vazio = null;
      var indefinido;
  
      console.log("String:", texto);
      console.log("Number:", numero);
      console.log("Boolean:", booleano);
      console.log("Array:", lista);
      console.log("Objeto:", objeto);
      console.log("Null:", vazio);
      console.log("Undefined:", indefinido);
    </script>
</body>
</html>
